<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darin</title>
  <link rel="icon" type="image/png" href="/static/Darin_Round.png" />
  <link rel="stylesheet" href="/static/styles.css" />
  <!-- Bootstrap token from URL before any JS runs -->
  <script>window.APP_TOKEN = new URLSearchParams(location.search).get('token');</script>
</head>
<body>

<header>
  <img src="/static/Darin_Round.png" alt="Darin" class="header-logo" />
  <h1>DARIN</h1>
  <span id="state-badge" class="badge badge-idle">Idle</span>
</header>

<main>

  <!-- ── Meeting Controls ─────────────────────────────────────── -->
  <section id="meeting-controls" class="card">
    <div class="controls-row">
      <button id="btn-start-meeting" class="btn btn-green">Start Meeting</button>
      <button id="btn-stop-meeting"  class="btn btn-red"   hidden>Stop Meeting</button>
      <button id="btn-new-meeting"   class="btn btn-grey"  hidden>New Meeting</button>
    </div>
    <div id="timer-row" hidden>
      <span class="pulse-dot"></span>
      <span id="timer-label">00:00:00</span>
    </div>
  </section>

  <!-- ── Capture Controls ──────────────────────────────────────── -->
  <section id="capture-controls" class="card">
    <div class="controls-row">
      <button id="btn-last-30" class="btn btn-outline">Last 30s</button>
      <button id="btn-last-60" class="btn btn-outline">Last 60s</button>
      <span id="capture-status" class="status-text"></span>
    </div>
  </section>

  <!-- ── Output Section ────────────────────────────────────────── -->
  <section id="output-section" class="card">
    <div id="output-title" class="output-title">Analysis Output</div>
    <div id="output-panel"></div>
    <div id="output-markdown" hidden></div>
  </section>

  <!-- ── Mid-Meeting Prompts (active only) ─────────────────────── -->
  <section id="mid-meeting-prompts" hidden>
    <div class="bucket-header">Meeting Analysis</div>
    <div id="bucket-analysis" class="bucket bucket-blue"></div>

    <div class="bucket-header">Reasoning Frameworks</div>
    <div id="bucket-reasoning" class="bucket bucket-amber"></div>
  </section>

  <!-- ── Post-Meeting Prompts (post_meeting only) ──────────────── -->
  <section id="post-meeting-prompts" hidden>
    <div class="bucket-header">Post-Meeting Analysis</div>

    <div id="segment-controls" class="segment-controls">
      <label class="radio-label">
        <input type="radio" name="segment-mode" value="full" checked />
        Full Transcript
      </label>
      <label class="radio-label">
        <input type="radio" name="segment-mode" value="range" />
        Time Range
      </label>
      <span id="range-inputs" class="range-inputs" hidden>
        <input type="number" id="from-minute" min="0" placeholder="From (min)" class="range-input" />
        <span>–</span>
        <input type="number" id="to-minute"   min="0" placeholder="To (min)"   class="range-input" />
      </span>
    </div>

    <div id="bucket-post-meeting" class="bucket bucket-purple"></div>

    <div class="controls-row" style="margin-top:1rem">
      <button id="btn-copy-transcript" class="btn btn-outline">Copy Transcript</button>
    </div>
  </section>

  <!-- ── Progress Bar ──────────────────────────────────────────── -->
  <div id="progress-bar" class="progress-bar" hidden></div>

</main>

<script src="/static/app.js"></script>
</body>
</html>
