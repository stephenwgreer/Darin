[project]
name = "nicegui-validation-spike"
version = "0.1.0"
description = "Validation spike: NiceGUI + soundcard COM compatibility, streaming latency, packaging"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nicegui>=3.0.0,<3.1",
    "numpy>=1.26.0,<2.0",
    "soundcard==0.4.3",
    "comtypes==1.4.10",
    "loguru>=0.7.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]
