[project]
name = "darin-audio-assistant"
version = "0.1.0"
description = "Desktop audio assistant for real-time meeting transcription and AI-powered analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.0",
    "sounddevice==0.4.6",
    "soundcard==0.4.3",
    "comtypes==1.4.10",
    "soundfile==0.13.1",
    "keyboard",
    "deepgram-sdk==2.12.0",
    "python-dotenv==1.0.0",
    "anthropic>=0.40.0",
    "PyQt6==6.6.1",
    "PyQt6-Qt6>=6.6.0,<6.7",
    "PyQt6-WebEngine==6.6.0",
    "PyQt6-WebEngine-Qt6>=6.6.0,<6.7",
    "markdown2==2.5.3",
    "scipy",
    "pytest>=9.0.2",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
]
