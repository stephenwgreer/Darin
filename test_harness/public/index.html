<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darin Test Harness</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🧪 Darin Test Harness</h1>
    <div class="status-dot" id="status-dot"></div>
    <span class="header-meta" id="status-text">idle</span>
    <div class="header-spacer"></div>
    <button class="test-btn test-btn-primary" id="load-btn" onclick="loadTranscript()">Load Transcript</button>
  </header>

  <div class="harness-layout">
    <!-- LEFT: transcript + prompt buckets -->
    <div class="harness-left">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Transcript</span>
          <span class="panel-badge" id="transcript-chars">0 chars</span>
        </div>
        <div class="panel-body" style="padding:10px">
          <textarea
            id="transcript-area"
            class="test-textarea"
            style="height:200px"
            placeholder="Click 'Load Transcript' to load test_audio/test.txt, or paste your own text here…"
            oninput="updateCharCount()"
          ></textarea>
        </div>
      </div>

      <!-- Bucket 1: Mid-Meeting -->
      <div class="panel" style="margin-top:10px">
        <div class="panel-header">
          <span class="panel-title" style="color:var(--accent)">Bucket 1 — Mid-Meeting</span>
          <span class="panel-badge">9 prompts</span>
        </div>
        <div class="panel-body">
          <div class="bucket-buttons" id="bucket-mid_meeting"></div>
        </div>
      </div>

      <!-- Bucket 2: Reasoning -->
      <div class="panel" style="margin-top:10px">
        <div class="panel-header">
          <span class="panel-title" style="color:var(--purple)">Bucket 2 — Reasoning Frameworks</span>
          <span class="panel-badge">5 prompts</span>
        </div>
        <div class="panel-body">
          <div class="bucket-buttons" id="bucket-reasoning"></div>
        </div>
      </div>

      <!-- Bucket 3: Post-Meeting -->
      <div class="panel" style="margin-top:10px">
        <div class="panel-header">
          <span class="panel-title" style="color:var(--yellow)">Bucket 3 — Post-Meeting Analysis</span>
          <span class="panel-badge">4 prompts</span>
        </div>
        <div class="panel-body">
          <div class="bucket-buttons" id="bucket-post_meeting"></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: output -->
    <div class="harness-right">
      <div class="panel" style="height:100%">
        <div class="panel-header">
          <span class="panel-title" id="output-title">Output</span>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="panel-badge" id="output-status"></span>
            <button class="test-btn" id="copy-btn" onclick="copyOutput()" style="display:none">Copy</button>
          </div>
        </div>
        <div class="panel-body" style="height:calc(100% - 45px);padding:10px">
          <div
            id="output-area"
            class="test-output"
            style="height:100%;max-height:none;white-space:pre-wrap"
          >Click a prompt button to run analysis…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
